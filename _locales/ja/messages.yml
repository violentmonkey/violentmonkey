  description: Hover title for search icon in dashboard.
  message: |-
    * <Enter> キーで自動補完の履歴に文字列を追加
    * 使用できる正規表現の構文: /条件/ や /条件/フラグ
  touched: false
titleSearchHintV2:
  description: >-
    Hover title for search icon in dashboard. Do not translate content between
    <code>...</code>.
  message: >-
    * 条件は半角スペースで区切ります

    * すべての条件に一致する必要があります

    * 引用符なしの小文字、または<code>re:</code>で始まる条件は大文字と小文字を区別しません

    * 大文字・小文字の混在、"引用符付きの文字列"、"i"フラグなしの<code>/re/</code>は大文字と小文字を区別します

    * メタデータで検索：<code>"Awesome Script" "Description"</code>

    * タグで検索：<code>#tag1 #tag2</code>

    * スクリプト名で検索：<code>name:"awesome name"</code>

    * スクリプトコードで検索：<code>code:"awesome code"</code>

    * 除外検索：<code>!#tag2 !name:"unwanted"</code>

    *
    正規表現：<code>/\w+?/</code>、<code>/\w+?/gi</code>、<code>name:/\w+?/</code>、<code>name+re:"\w+?
    with space"</code>
